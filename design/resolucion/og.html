<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Tarjeta social — Resolución</title>
<meta name="viewport" content="width=1200">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="resolucion.css">
<link rel="stylesheet" href="views.css">
<style>body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }</style>
</head>
<body>
<div class="og">
  <p class="k" id="k"></p>
  <h1 class="n" id="n"></h1>
  <div class="f"><span id="d"></span><b id="u"></b></div>
</div>
<script>
/* Una sola plantilla 1200x630; ?v=home | links | blog. Se captura a og/<v>.png. */
const V = {
  home: ["desarrollador full-stack", "Sebastián\nBravo", "plataformas web completas, con IA donde resuelve un problema real", "sebita.dev"],
  links: ["sebastián bravo, desarrollador full-stack", "links", "portafolio, proyectos, blog, github, linkedin y agenda", "sebita.dev/links"],
  blog: ["sebastián bravo", "blog", "full-stack, IoT, machine learning y lecciones de código en producción", "sebita.dev/blog"],
}
const v = V[new URLSearchParams(location.search).get("v")] || V.home
const $ = (id) => document.getElementById(id)
$("k").textContent = v[0]
$("n").textContent = v[1]
$("n").style.fontSize = v[1].includes("\n") ? "190px" : "260px"
$("d").textContent = v[2]
$("u").textContent = v[3]
</script>
</body>
</html>
